<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#10B981" stroke-width="4" stroke-opacity="0.3" fill="none"/>
  
  <!-- Stylized Dosa / Breakfast Pan & Flame / Sparkle -->
  <g filter="url(#glow)" transform="translate(48, 52)">
    <!-- Plate / Tawa circle -->
    <circle cx="208" cy="204" r="160" stroke="url(#primaryGrad)" stroke-width="18" fill="#0F172A" fill-opacity="0.8"/>
    <circle cx="208" cy="204" r="128" stroke="#F59E0B" stroke-width="6" stroke-dasharray="16 10" stroke-opacity="0.6"/>
    
    <!-- Crossed Spatula / Fork / Duel Swords vibe -->
    <path d="M120 292 L296 116 M140 312 L316 136" stroke="#10B981" stroke-width="12" stroke-linecap="round"/>
    <path d="M296 292 L120 116 M316 312 L140 136" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>

    <!-- Center Glowing Star / Sparkle of Choice -->
    <polygon points="208,150 222,192 264,204 222,216 208,258 194,216 152,204 194,192" fill="url(#primaryGrad)"/>
  </g>

  <!-- Text Badge -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#34D399" letter-spacing="3">BREAKFAST DUEL</text>
</svg>
